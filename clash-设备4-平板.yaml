# ============================================================
#  设备：4-平板      服务端识别名：pad
#  香港主力 + 东京备用，四份配置互相独立，不要混用
#  生成时间：2026-11-09
# ============================================================
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geox-url:
  geoip: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat'
  geosite: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat'
  mmdb: 'https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb'

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query

proxies:
  # ---------- 主力：香港 Hysteria2（UDP，48ms，快）----------
  - name: 香港-Hysteria2
    type: hysteria2
    server: 47.76.52.20
    port: 8443
    password: "pad:HKpd2026x4"
    sni: www.bing.com
    skip-cert-verify: true
    up: '100 Mbps'
    down: '150 Mbps'

  # ---------- 备用 1：香港 Reality（TCP，UDP 被限速时用）----------
  - name: 香港-Reality
    type: vless
    server: 47.76.52.20
    port: 443
    uuid: 002051ff-9829-4c01-91a5-725a93302152
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.bing.com
    client-fingerprint: chrome
    skip-cert-verify: false
    reality-opts:
      public-key: 168XHqa8oV1xvgxaFEHe1gsmXZTbk4eI7dn6WZe8Dl8
      short-id: 2e14ed74

  # ---------- 备用 2：东京 Hysteria2 ----------
  - name: 东京-Hysteria2
    type: hysteria2
    server: 167.179.70.250
    port: 8443
    password: "pad:TKpd2026y4"
    sni: www.bing.com
    skip-cert-verify: true
    up: '100 Mbps'
    down: '150 Mbps'

  # ---------- 兜底：东京 Reality ----------
  - name: 东京-Reality
    type: vless
    server: 167.179.70.250
    port: 443
    uuid: 8c02899d-dd0e-4c1c-a996-0212a2e4e94b
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.bing.com
    client-fingerprint: chrome
    skip-cert-verify: false
    reality-opts:
      public-key: IToKT7TKjgKoeQukg2LsPWc3oX2ctspcv4eLRbhuYVA
      short-id: a40b5538

proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 香港-Hysteria2
      - 香港-Reality
      - 东京-Hysteria2
      - 东京-Reality
      - DIRECT

rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - GEOSITE,geolocation-!cn,节点选择
  - MATCH,节点选择
